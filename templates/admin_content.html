{% extends "base.html" %}{% block title %}المحتوى والبنرات{% endblock %}{% block content %}<section class="container admin-page"><h1>المحتوى والبنرات</h1><nav class="admin-nav"><a href="{{ url_for('admin_dashboard') }}">لوحة التحكم</a><a href="{{ url_for('admin_settings') }}">الإعدادات</a></nav><h2>إضافة بانر</h2><form class="admin-add-form" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="kind" value="banner"><label>العنوان<input name="title" required></label><label>الوصف<input name="subtitle"></label><label>رابط الصورة<input name="image_url"></label><label>الرابط المستهدف<input name="link_url" value="/"></label><label>ترتيب الظهور<input type="number" name="sort_order" value="0"></label><label><input type="checkbox" name="active" value="1" checked> مفعّل</label><button class="button button-primary">إضافة بانر</button></form><h2>إدارة البنرات</h2>{% for banner in banners %}<form class="admin-add-form" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="kind" value="banner"><input type="hidden" name="banner_id" value="{{ banner.id }}"><label>العنوان<input name="title" value="{{ banner.title }}" required></label><label>الوصف<input name="subtitle" value="{{ banner.subtitle }}"></label><label>رابط الصورة<input name="image_url" value="{{ banner.image_url }}"></label><label>الرابط المستهدف<input name="link_url" value="{{ banner.link_url }}"></label><label>ترتيب الظهور<input type="number" name="sort_order" value="{{ banner.sort_order }}"></label><label><input type="checkbox" name="active" value="1" {% if banner.active %}checked{% endif %}> مفعّل</label><button class="button button-outline">حفظ البانر</button></form>{% endfor %}<h2>صفحات المتجر</h2><form class="admin-add-form" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="kind" value="page"><label>المسار (about, returns, terms, privacy)<input name="slug" required></label><label>العنوان<input name="title" required></label><label class="admin-wide">المحتوى<textarea name="body" rows="5"></textarea></label><button class="button button-primary">حفظ الصفحة</button></form>{% for page in pages %}<form class="admin-add-form" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="kind" value="page"><input type="hidden" name="slug" value="{{ page.slug }}"><label>الصفحة<input value="{{ page.slug }}" disabled></label><label>العنوان<input name="title" value="{{ page.title }}" required></label><label class="admin-wide">المحتوى<textarea name="body" rows="5">{{ page.body }}</textarea></label><button class="button button-outline">تحديث {{ page.title }}</button><a href="{{ url_for('page', slug=page.slug) }}">عرض الصفحة</a></form>{% endfor %}</section>{% endblock %}
